name: CI Dev

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'ride2trip' }}
  FRONTEND_SWARM_SERVICE: ${{ vars.FRONTEND_SWARM_SERVICE || 'front_frontend' }}

jobs:
  check_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build:prod

  build_push:
    runs-on: ubuntu-latest
    needs:
      - check_build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image ref
        id: image
        run: |
          image_ref="${DOCKERHUB_NAMESPACE}/frontend:dev-${GITHUB_SHA::7}"
          echo "FRONTEND_IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.DOCKERHUB_NAMESPACE }}/frontend:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_push
    if: github.event_name == 'push'
    environment: DEV
    steps:
      - name: Compute image ref
        run: echo "FRONTEND_IMAGE_REF=${DOCKERHUB_NAMESPACE}/frontend:dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H "${{ secrets.SWARM_HOST }}" >> ~/.ssh/known_hosts

      - name: Create docker context
        run: |
          docker context create swarm --docker "host=ssh://${{ secrets.SWARM_USER }}@${{ secrets.SWARM_HOST }}"
          docker --context swarm info

      - name: Update frontend service
        run: |
          set -euo pipefail
          docker --context swarm service update \
            --with-registry-auth \
            --detach=false \
            --image "$FRONTEND_IMAGE_REF" \
            "$FRONTEND_SWARM_SERVICE"
