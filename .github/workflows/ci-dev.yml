name: CI Dev

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'ride2trip' }}
  SWARM_SERVICE: ${{ vars.FRONTEND_SWARM_SERVICE || 'front_frontend' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'frontend' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'DEV' }}

jobs:
  check_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build:prod

  build_push:
    runs-on: ubuntu-latest
    needs:
      - check_build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image ref
        id: image
        run: |
          image_ref="${DOCKERHUB_NAMESPACE}/${SERVICE_NAME}:dev-${GITHUB_SHA::7}"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.SERVICE_NAME }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_push
    if: github.event_name == 'push'
    environment: DEV
    steps:
      - name: Compute image ref
        run: echo "IMAGE_REF=${DOCKERHUB_NAMESPACE}/${SERVICE_NAME}:dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H "${{ secrets.SWARM_HOST }}" >> ~/.ssh/known_hosts

      - name: Create docker context
        run: |
          set -euo pipefail
          echo "DEPLOY_STEP=Preparation" >> "$GITHUB_ENV"

          docker context create swarm --docker "host=ssh://${{ secrets.SWARM_USER }}@${{ secrets.SWARM_HOST }}"
          docker --context swarm info

      - name: Update frontend service
        run: |
          set -euo pipefail
          echo "DEPLOY_STEP=Swarm rollout" >> "$GITHUB_ENV"

          docker --context swarm service update \
            --with-registry-auth \
            --detach=false \
            --image "$IMAGE_REF" \
            "$SWARM_SERVICE"
      
      - name: Healthcheck ${{ env.SERVICE_NAME }}
        run: |
          set -euo pipefail
          echo "DEPLOY_STEP=Healthcheck" >> "$GITHUB_ENV"

          HEALTHCHECK_URL="http://${{ secrets.SWARM_HOST }}:3000/"

          for i in {1..30}; do
            echo "Healthcheck attempt $i/30"

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "$HEALTHCHECK_URL"; then

              echo "Frontend is healthy"
              exit 0
            fi

            sleep 5
          done

          echo "Frontend healthcheck failed"
          exit 1

      - name: Notify successful deployment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DEPLOY_THREAD_ID: ${{ secrets.TELEGRAM_FRONTEND_THREAD_ID }}
          GH_TOKEN: ${{ github.token }}
        if: success()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PR_INFO="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=${GITHUB_REF_NAME}&per_page=100" \
              --jq --arg sha "$GITHUB_SHA" '
                .[]
                | select(.merged_at != null)
                | select(.merge_commit_sha == $sha)
                | "\(.number)|\(.title)|\(.user.login)"
              ' |
              head -n 1
          )"

          if [[ -n "$PR_INFO" ]]; then
            IFS='|' read -r PR_NUMBER PR_TITLE PR_AUTHOR <<< "$PR_INFO"
          else
            PR_NUMBER=""
            PR_TITLE=""
            PR_AUTHOR="Direct push"
          fi

          MESSAGE="✅ DEPLOY SUCCESS

          Service: ${SERVICE_NAME}
          Environment: ${ENVIRONMENT}
          Version: dev-${SHORT_SHA}
          Commit: ${SHORT_SHA}
          Branch: ${GITHUB_REF_NAME}

          🔀 PR #${PR_NUMBER}
          ${PR_TITLE}

          👤 PR author: ${PR_AUTHOR}
          👤 Triggered by: ${GITHUB_ACTOR}

          🐳 Image:
          ${IMAGE_REF}

          🏥 Healthcheck: OK
          📦 Swarm service: ${SWARM_SERVICE}

          🔗 GitHub:
          ${RUN_URL}"

          if ! curl -sS -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "message_thread_id=${TELEGRAM_DEPLOY_THREAD_ID}" \
                --data-urlencode "text=${MESSAGE}"; then
              echo "Failed to send Telegram notification"
          fi

  notify_failure:
    runs-on: ubuntu-latest
    needs:
      - check_build
      - build_push
      - deploy
    if: ${{ always() && (needs.check_build.result == 'failure' || needs.build_push.result == 'failure' || needs.deploy.result == 'failure') }}
    steps:
      - name: Notify failed pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DEPLOY_THREAD_ID: ${{ secrets.TELEGRAM_DEPLOY_THREAD_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILED_JOB="Unknown"

          if [[ "${{ needs.build_push.result }}" == "failure" ]]; then
            FAILED_JOB="Build/Push"
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            FAILED_JOB="Deploy"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PR_INFO="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=${GITHUB_REF_NAME}&per_page=100" \
              --jq --arg sha "$GITHUB_SHA" '
                .[]
                | select(.merged_at != null)
                | select(.merge_commit_sha == $sha)
                | "\(.number)|\(.title)|\(.user.login)"
              ' |
              head -n 1
          )"

          if [[ -n "$PR_INFO" ]]; then
            IFS='|' read -r PR_NUMBER PR_TITLE PR_AUTHOR <<< "$PR_INFO"
          else
            PR_NUMBER=""
            PR_TITLE=""
            PR_AUTHOR="Direct push"
          fi


          MESSAGE="❌ PIPELINE FAILED

          Service: ${SERVICE_NAME}
          Environment: ${ENVIRONMENT}
          Version: dev-${SHORT_SHA}
          Commit: ${SHORT_SHA}
          Branch: ${GITHUB_REF_NAME}

          💥 Failed stage:
          ${FAILED_JOB}

          🔀 PR #${PR_NUMBER}
          ${PR_TITLE}

          👤 PR author: ${PR_AUTHOR}
          👤 Triggered by: ${GITHUB_ACTOR}

          🔗 GitHub:
          ${RUN_URL}"

          if ! curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_DEPLOY_THREAD_ID}" \
            --data-urlencode "text=${MESSAGE}"; then
              echo "Failed to send Telegram notification"
          fi